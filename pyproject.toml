[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demiflow"
version = "0.3.0"
description = "Declarative dataset pipelines: lazy local execution, async streaming stage, Lance I/O, LLM operators"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["pyarrow==25.0.1", "PyYAML>=6", "click>=8", "packaging>=23", "datafusion==54.0.0", "pylance==12.0.0+demiflow.arrowfix1", "cloudpickle>=2.2", "psutil>=5.9", "tomli>=2; python_version < '3.11'"]

[project.scripts]
demiflow = "demiflow.cli:main"

[project.entry-points."jupyter_client.kernel_provisioners"]
demiflow-sandbox = "demiflow.workbench.analysis.provisioner:SandboxProvisioner"

[project.optional-dependencies]
local = ["cloudpickle>=2.2"]
# Closed managed tensor value protocol; CUDA devices remain deployment-owned.
gpu = ["torch>=2.13,<2.14"]
fetch = ["httpx>=0.27,<0.29"]
queue-postgresql = ["psycopg[binary]>=3.3,<4"]
lance = ["pylance>=0.9"]
ray = ["ray[data]>=2.9"]
llm = ["requests>=2.31", "httpx>=0.27"]      # operator_llm 客户端惰性 import requests（真实依赖）
tokens = ["tiktoken>=0.9"]
images = ["pillow>=10"]
embeddings = ["httpx>=0.27", "pillow>=10"]
services = ["httpx>=0.27", "uv>=0.8,<1"]
wikitext = ["mwparserfromhell==0.7.2"]
pdf = ["pypdf==6.19.0"]
# Native search worker: HTTP transport, HTML parsing and locale data for the built-in source adapters.
search = ["httpx>=0.27", "babel==2.18.0", "lxml>=6.1.2,<7", "curl_cffi==0.16.1"]
search-browser = ["playwright==1.63.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
analysis = ["jupyter_client==8.10.0", "ipykernel==7.3.0", "nbformat==5.11.1",
            "pandas==2.3.3", "matplotlib==3.11.1", "pillow==12.3.0"]
notebook = ["notebook==7.5.7", "jupyterlab==4.5.11", "ipykernel==7.3.0", "pandas==2.3.3"]

[tool.setuptools.packages.find]
include = ["demiflow*"]

[tool.setuptools.package-data]
"demiflow.collect.native_search" = ["inventory.json"]
"demiflow.forge" = ["standards/*.json", "standards/pipeline-authoring.md", "standards/pipeline-review.md", "skills/demiforge/SKILL.md", "skills/dataskill/SKILL.md"]
"demiflow.workbench" = ["analysis/*.json", "web/*.html", "web/*.js", "web/*.css", "web/*.txt", "web/*.json"]
"demiflow.workbench.conversations" = ["*.cjs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: long-running or high-resource stress coverage",
    "network: requires real external network; mocks and loopback are excluded",
    "gpu: requires a physical GPU or real model weights",
    "ray: contacts a real Ray runtime or cluster",
]
