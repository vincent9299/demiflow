[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demiflow"
version = "0.1.0"
description = "Declarative dataset pipelines: lazy local execution, async streaming stage, Lance I/O, LLM operators"
requires-python = ">=3.10"
dependencies = ["pyarrow>=14", "PyYAML>=6", "click>=8", "packaging>=23"]

[project.optional-dependencies]
lance = ["pylance>=0.9"]
ray = ["ray[data]>=2.9"]
llm = ["openai>=1.0", "httpx>=0.27"]
crawl = ["crawl4ai>=0.9"]
images = ["pillow>=10"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["demiflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
