[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demiflow"
version = "0.3.0"
description = "Declarative dataset pipelines: lazy local execution, async streaming stage, Lance I/O, LLM operators"
requires-python = ">=3.10"
dependencies = ["pyarrow==25.0.1", "PyYAML>=6", "click>=8", "packaging>=23", "datafusion==54.0.0", "pylance==12.0.0+demiflow.arrowfix1", "cloudpickle>=2.2", "psutil>=5.9"]

[project.optional-dependencies]
local = ["cloudpickle>=2.2"]
lance = ["pylance>=0.9"]
ray = ["ray[data]>=2.9"]
llm = ["requests>=2.31", "httpx>=0.27"]      # operator_llm 客户端惰性 import requests（真实依赖）
crawl = ["crawl4ai>=0.9"]
images = ["pillow>=10"]
embeddings = ["httpx>=0.27", "pillow>=10"]
wikitext = ["mwparserfromhell==0.7.2"]
pdf = ["pypdf==6.19.0"]
# 聚合 extras：一键装齐采集栈（net/fetch 零三方依赖，crawl 与 images 惰性）
collect = ["crawl4ai>=0.9", "pillow>=10", "httpx>=0.27"]
# Vendored SearXNG adapters and their shared runtime; no SearXNG deployment.
search = ["httpx>=0.27", "babel==2.18.0", "flask-babel==4.0.0", "flask==3.1.3",
          "lxml>=6.1.2,<7", "pygments==2.21.0", "python-dateutil==2.9.0.post0",
          "curl_cffi==0.16.1", "valkey==6.1.1", "markdown-it-py==4.2.0",
          "msgspec==0.21.1", "typer>=0.27.1,<0.28", "isodate==0.7.2", "typing-extensions>=4.15"]
search-mysql = ["mysql-connector-python>=9"]
search-mariadb = ["mariadb>=1.1"]
search-postgresql = ["psycopg2-binary>=2.9"]
search-mongodb = ["pymongo>=4"]
search-browser = ["playwright==1.63.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["demiflow*"]
exclude = ["demiflow._vendor.searxng*"]

[tool.setuptools.package-data]
"demiflow.collect.native_search" = ["inventory.json"]
"demiflow._vendor" = ["searxng/**/*", "searxng/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
