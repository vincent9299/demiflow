schema_version: demiflow_prompt_pack_v2
prompts:
  judge_instruction_alignment:
    version: t2i-instruction-alignment-1
    model:
      name: Q-Judger
      transport: openai_compatible
      base_url_env: Q_JUDGER_BASE_URL
      api_key_env: Q_JUDGER_API_KEY
    response_format: json
    schema_retries: 0
    template: |
      ## 1. 任务与评价目标

      **判断生成图是否完整、准确地实现题面提出的视觉要求。题面要求画什么、怎样画、展示什么，就检查这些要求是否得到实现。**

      - **完整执行题面。** 检查指定对象、数量、属性、动作、关系、场景和呈现方式，保留对象指代、限定条件、禁止内容及允许变化。
      - **检查实际完成情况。** 根据待评图中的可见内容逐项判断，不能只看关键词或大致主题是否对应。
      - **理解对象，但不展开知识清单。** 必须检查所画对象是否符合题意；不由对象名称进一步扩展出整套概念形态、结构、纹理等知识检查。
      - **明确写出的要求都要检查。** 某项要求即使涉及概念知识，只要题面已经提出，就仍属于执行检查，不能因为另有正确性评测而跳过。
      - **不追加题面外的标准。** 不要求未指定的典型画法、参考实例细节或更好的审美效果。风格、光照、清晰展示等按题面要求检查。

      ## 2. 输入及其作用

      - **完整生成题面 instruction：** 确定本次应满足的要求。
      - **Image 1：一张待评图。** 提供实际完成情况的视觉证据。
      - **固定检查维度：** 帮助组织检查、发现遗漏，不为题面增加要求。

      ## 3. 检查维度：12类＋兜底

      | 维度 | 检查范围与边界 |
      |---|---|
      | 主体与数量 | 指定主体、配物及数量是否出现；区分主体与其他对象，保留全部、至少、仅有等限定。 |
      | 外观与属性 | 指定颜色、材质、形状、大小及其他外观属性，是否落实到对应对象。 |
      | 动作与状态 | 动作、姿态、表情及进行、停止、开启、闭合等当前状态是否符合要求。 |
      | 位置与布局 | 单幅画面的左右、前后、上下、排列、主体位置、占比、留白及横竖画幅等要求。 |
      | 对象关系 | 接触、承托、包含、配合及比较关系是否实现；分别出现不等于关系成立。 |
      | 场景与背景 | 场所、时间、季节、天气及背景内容是否符合题面；未限定部分不追加偏好。 |
      | 视角与取景 | 观察方向、相机位置、景别、纳入画面的范围及裁切要求。 |
      | 必要展示与可辨性 | 指定部位和细节是否可见、可辨，是否遵守遮挡条件；文字可读性归文字与标注。 |
      | 光照与成像效果 | 指定光源方向、柔硬、明暗效果、对焦和景深等是否实现，不以一般成像质量代替要求。 |
      | 风格与表现形式 | 指定摄影、绘画、剪纸、示意图等形式与风格是否实现，不以个人审美评分。 |
      | 文字与标注 | 文字内容、语言、字体、方向、可读性、排版及指向关系是否符合要求。 |
      | 多视图与分格 | 多幅图的数量、组织、顺序、对应对象及题面要求的一致性。 |
      | 其他题面要求 | 题面确实提出、无法合理归入上述类别的要求，必须指出原文和检查内容。 |

      **禁止、条件和允许变化作用于相应要求，不另设评分维度。** 例如，“不添加文字”归文字与标注，“其余工具可以遮挡”限定必要展示的检查范围。

      ## 4. 完整覆盖与判断规则

      - **逐条落实实质要求。** 将题面要求对应到检查维度。同一维度包含多个要求时，全部核对，不能以其中一项满足代替其余要求。
      - **回读题面检查遗漏。** 核对对象限定、局部条件、数量范围、禁止内容、必要展示和允许变化。不能以“所有维度都评过了”代替完整覆盖。
      - **要求绑定正确对象。** 属性出现在其他对象上，不代表指定对象满足；同一对象应满足的内容不能从多个对象拼接。
      - **保留条件与逻辑。** 区分全部、至少一个、仅限某处、任选其一和条件触发。“或”不能改成“都要”，允许出现不能改成必须出现。
      - **证据来自待评图。** 题面说明应当画什么，不能证明已经画出什么；应寻找对应对象、部位或关系的实际证据。
      - **接受允许变化。** 对自由背景、任选位置及允许遮挡等不追加限制。额外内容只有违反已有要求时才影响判断。
      - **必要展示不能免查。** 明确要求完整入画、清楚展示或能够辨认的内容，不能以裁切、遮挡或模糊豁免；允许不展示的内容不作推测。
      - **同一要求不重复计分。** 按最直接的检查内容归类，不换名重复扣分；其余独立要求继续检查。
      - **无法核验时说明限制。** 无法从图像可靠确认的内容，不猜测为满足或失败。

      ## 5. 评分标准与边界

      | 分数 | 标准 |
      |---|---|
      | 0：要求未满足 | 本维度任一适用的题面要求存在明确未完成、违反或必要展示缺失。其他要求完成不能抵消。 |
      | 1：完全满足要求 | 本维度全部适用要求得到满足，有对应视觉证据。普通但完整的执行可以得1分。 |
      | 2：执行有出色表现 | 满足1分，并有直接属于本维度执行效果的具体、可观察的出色表现，须说明证据。 |

      - **1不是部分满足。** 不用“主要要求完成”忽略其他明确违反，也不为解释1分编造缺陷。
      - **2不是没有发现错误。** 不以画面美观、无关装饰或增加任务内容作为加分理由。
      - **不强求每项都有2分空间。** 数量、有无等要求可能只有达标空间，不能为给2分临时增加标准。
      - **N/A只表示不适用。** 题面没有对应要求，或明确的适用条件未触发。必要对象缺失不能让要求自动变成不适用。
      - **无法判断单独记录。** 区分明确未完成、允许不可见和评审无法可靠辨认；后者不强行记0，也不冒充N/A或通过。

      ## 6. 输出与覆盖自查

      只输出符合 schema 的 JSON，最外层为 result，包含 dimension_scores。使用第3节的12类及兜底名称作为键，每类恰好出现一次，每类返回：

      - **分数 score：** 整数0、1、2或字符串 N/A；无法可靠判断时为 null，并在 reason 中说明原因。
      - **对应要求 requirements：** 用字符串列表引用题面短句或准确概括，保留影响判断的条件和范围。没有对应要求时为空列表。
      - **必要证据与理由 reason：** 说明实际观察与分数的联系，以及不适用或无法判断的原因。

      输出前核对：

      - 每项实质要求是否都有对应检查。
      - 同类要求是否全部核对，条件、否定和允许变化是否保留。
      - 是否重复归项或追加题面没有的要求。
      - 分数是否与可见证据一致。

      对应要求直接附在维度结果中，不另生成是非子问题，不计算总分。

      ### 本次输入

      完整生成题面 instruction：
      {{ instruction }}

      Image 1：待评图，本次评分对象
      {{ generated_image | image }}
    response_schema:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result:
          type: object
          additionalProperties: false
          required: [dimension_scores]
          properties:
            dimension_scores:
              type: object
              additionalProperties: false
              required:
                - 主体与数量
                - 外观与属性
                - 动作与状态
                - 位置与布局
                - 对象关系
                - 场景与背景
                - 视角与取景
                - 必要展示与可辨性
                - 光照与成像效果
                - 风格与表现形式
                - 文字与标注
                - 多视图与分格
                - 其他题面要求
              properties:
                主体与数量: &alignment_dimension
                  type: object
                  additionalProperties: false
                  required: [score, requirements, reason]
                  properties:
                    score:
                      enum: [0, 1, 2, N/A, null]
                    requirements:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    reason:
                      type: string
                      minLength: 1
                外观与属性: *alignment_dimension
                动作与状态: *alignment_dimension
                位置与布局: *alignment_dimension
                对象关系: *alignment_dimension
                场景与背景: *alignment_dimension
                视角与取景: *alignment_dimension
                必要展示与可辨性: *alignment_dimension
                光照与成像效果: *alignment_dimension
                风格与表现形式: *alignment_dimension
                文字与标注: *alignment_dimension
                多视图与分格: *alignment_dimension
                其他题面要求: *alignment_dimension
